name: spacescans-web

# One-command local run:  docker compose up --build
# Frontend → http://localhost:3000   Backend → http://localhost:8000
#
# Prereq: the pipeline wheel must be present at backend/wheels/*.whl
#   (see DOCKER.md — copy it from the parent repo's dist/).

services:
  backend:
    build:
      context: ./backend
    image: spacescans-web-backend
    # Auto-recover from crashes (e.g. an OOM-killed process) instead of
    # leaving the frontend with "Failed to fetch" until someone intervenes.
    restart: unless-stopped
    environment:
      # The exposure dataset folders (BG/, Noise/, TIGER/, ...) live directly
      # under the data root, mounted at /project. The pipeline resolves
      # config-relative paths (Noise/C3/..., NDI/C4/...) against this.
      SPACESCANS_DATA_DIR: /project
      # Config templates ship IN this repo (configs/), mounted at /configs — so
      # they don't depend on the parent. Path resolution is independent of where
      # the config lives (paths resolve against SPACESCANS_DATA_DIR).
      SPACESCANS_CONFIG_TEMPLATES_DIR: /configs
      # In-container interpreter + CLI (the conda base env / wheel console
      # script). Absolute paths — the backend validates these exist on startup.
      SPACESCANS_PIPELINE_PYTHON: /opt/conda/bin/python
      SPACESCANS_PIPELINE_CLI: /opt/conda/bin/spacescans
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      # Config templates from this repo (versioned, not from the parent).
      - ./configs:/configs:ro
      # Exposure data root (contains the dataset folders directly). Defaults to
      # the in-repo pipeline-data/ folder — drop your data there for a
      # standalone setup. Point SPACESCANS_DATA_HOST elsewhere in .env to reuse
      # an existing data tree without copying.
      - ${SPACESCANS_DATA_HOST:-./pipeline-data}:/project
      # Persistent app state: SQLite DB, tasks/, c3_cache/.
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: spacescans-web-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
