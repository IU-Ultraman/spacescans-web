name: spacescans-web

# One-command local run:  docker compose up --build
# Frontend → http://localhost:3000   Backend → http://localhost:8000
#
# Prereq: the pipeline wheel must be present at backend/wheels/*.whl
#   (see DOCKER.md — copy it from the parent repo's dist/).

services:
  backend:
    build:
      context: ./backend
    image: spacescans-web-backend
    # Auto-recover from crashes (e.g. an OOM-killed process) instead of
    # leaving the frontend with "Failed to fetch" until someone intervenes.
    restart: unless-stopped
    environment:
      # The exposure dataset folders (BG/, Noise/, VNL/, ...) live directly
      # under the data root, mounted at /project. The pipeline resolves
      # config-relative paths (Noise/C3/..., NDI/C4/...) against this.
      SPACESCANS_DATA_DIR: /project
      # Config templates ship IN this repo (configs/), mounted at /configs — so
      # they don't depend on the parent. Path resolution is independent of where
      # the config lives (paths resolve against SPACESCANS_DATA_DIR).
      SPACESCANS_CONFIG_TEMPLATES_DIR: /configs
      # In-container interpreter + CLI (the conda base env / wheel console
      # script). Absolute paths — the backend validates these exist on startup.
      SPACESCANS_PIPELINE_PYTHON: /opt/conda/bin/python
      SPACESCANS_PIPELINE_CLI: /opt/conda/bin/spacescans
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # GitHub Codespaces browser access: lets the backend CORS-allow the
      # forwarded frontend origin. Empty outside Codespaces — no effect.
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
    volumes:
      # Config templates from this repo (versioned, not from the parent).
      - ./configs:/configs:ro
      # Exposure data root (contains the dataset folders directly). Defaults to
      # the in-repo pipeline-data/ folder — drop your data there for a
      # standalone setup. Point SPACESCANS_DATA_HOST elsewhere in .env to reuse
      # an existing data tree without copying.
      - ${SPACESCANS_DATA_HOST:-./pipeline-data}:/project
      # Persistent app state: SQLite DB, tasks/, c3_cache/.
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: spacescans-web-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ISEE 2026 workshop only — opt in with `docker compose --profile workshop up`.
  # Left out of the default stack so anyone running just the app does not pull
  # a 2 GB R image they will never open.
  rstudio:
    profiles: ["workshop"]
    build:
      context: ./rstudio
    image: spacescans-web-rstudio
    restart: unless-stopped
    environment:
      # No login screen. Safe because 8787 is never made public: in Codespaces
      # it stays a private forwarded port, so GitHub's own auth gates it, and
      # locally it is bound to this machine. Do NOT publicise this port —
      # an unauthenticated RStudio is arbitrary code execution.
      DISABLE_AUTH: "true"
    volumes:
      # The workshop scripts and their demo cohort, editable in place.
      - ./ISSE26:/home/rstudio/ISEE26Workshop
      # Read-only view of the app's task outputs, so R can read a run's
      # result.csv directly. In Codespaces the browser's Download button
      # saves to the attendee's laptop, not into the codespace — this mount
      # is what keeps the data where R can reach it.
      - backend-data:/home/rstudio/spacescans-runs:ro
    ports:
      - "8787:8787"

volumes:
  backend-data:
